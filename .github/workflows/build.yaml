name: Build & Push Image

# Manually triggered: Actions tab -> "Build & Push Image" -> Run workflow.
# Builds the production image and pushes it to GHCR as
# ghcr.io/<owner>/wip-aa:<tag>.
#
# Architecture (WIP dual-arch pattern, validated in World-in-a-Pie
# 2026-07-03): one NATIVE job per arch (amd64 on ubuntu-latest, arm64 on
# GitHub's native arm runner ubuntu-24.04-arm — free for public repos), each
# pushing <tag>-<arch>, then a stitch job welds them into one multi-arch index
# under the bare <tag> via `docker buildx imagetools create` (manifest-only,
# no rebuild, no layer transfer). No QEMU anywhere — this replaced the old
# single-job QEMU path (2-3x slower per emulated arch).
#
# The stitch job runs only if BOTH arch builds succeed (needs: [..., build]),
# so a bare <tag> is never a half-index. The build stamp + short SHA are
# resolved ONCE in resolve-tag and passed to both arch jobs, so both halves
# of the index are byte-identical.
#
# VITE_BASE_PATH must match the platform manifest's APP_BASE_PATH
# (apps/wip-aa/wip-app.yaml in World-in-a-Pie).
#
# Tag convention: version tags (e.g. 20260703a) are write-once — never
# re-point an existing version, bump instead. Adding a NEW tag to a manifest
# is fine. Empty tag input falls back to sha-<short>. The per-arch tags
# (<tag>-amd64, <tag>-arm64) stay in the registry as provenance; deploys
# always pin the bare <tag>.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. 20260703a). Leave empty for sha-<short-commit>.'
        required: false
        default: ''

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      stamp: ${{ steps.meta.outputs.stamp }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag + build metadata (once, shared by both arches)
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building with tag: $TAG (arch images: $TAG-amd64, $TAG-arm64)"

  build:
    needs: resolve-tag
    strategy:
      # One arch failing must not cancel the other — the stitch job's
      # needs: [build] gate then fails cleanly instead of half-stitching.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (${{ matrix.arch }}, native)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx build \
            --build-arg VITE_BASE_PATH=/apps/aa/ \
            --build-arg VITE_BUILD_STAMP="${{ needs.resolve-tag.outputs.stamp }}" \
            --build-arg VITE_BUILD_SHA="${{ needs.resolve-tag.outputs.sha }}" \
            -t "ghcr.io/${{ github.repository_owner }}/wip-aa:${{ needs.resolve-tag.outputs.tag }}-${{ matrix.arch }}" \
            --push .

  stitch:
    # Runs only if BOTH arch builds succeeded — a bare <tag> is never a
    # half-index, and both halves come from this run's single commit.
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Stitch per-arch images into a multi-arch tag
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          OWNER="ghcr.io/${{ github.repository_owner }}"
          # imagetools create is manifest-only (no rebuild, no retag-flatten).
          docker buildx imagetools create \
            -t "$OWNER/wip-aa:$TAG" \
            "$OWNER/wip-aa:$TAG-amd64" \
            "$OWNER/wip-aa:$TAG-arm64"
          docker buildx imagetools inspect "$OWNER/wip-aa:$TAG" | head -20
          echo "Done: $TAG is a multi-arch index (amd64+arm64) for wip-aa."
